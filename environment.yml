name: rised
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # Numerical / data stack pinned to the versions reported in the paper's
  # Computational Reproducibility section.
  - numpy>=1.26
  - pandas>=2.1
  - scipy>=1.13
  - scikit-learn>=1.5
  - matplotlib>=3.8
  - seaborn>=0.13
  - pip
  - pip:
    # ML libraries (cross-platform binary wheels)
    - xgboost>=2.0
    - shap>=0.46
    - fairlearn>=0.10
    # Cross-domain demo (Section 5)
    - folktables>=0.0.12
    # Hugging Face dataset loader (optional, for synthetic cohort mirror)
    - datasets>=2.20
    # Tests / linting
    - pytest>=7.4
    - pytest-cov>=4.1
    - black>=24.0
    - ruff>=0.5
    # Editable install of the rised package itself
    - -e .
